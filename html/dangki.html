<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
    <link rel="stylesheet" href="../css/style5.css">
</head>

<body>
	<h2>Đăng ký</h2>
	<form id="frmRegister">
	     <div class="form-group">
		<label for="txtUsername">Tài khoản</label>
		<input type="text" id="txtUsername" name="txtUsername">
  	     </div>
	     <div class="form-group">
		<label for="txtPassword">Mật khẩu</label>
		<input type="text" id="txtPassword" name="txtPassword">
	     </div>
	     <div class="form-group">
		<label for="txtConfirmPassword">Xác nhận mật khẩu</label>
		<input type="text" id="txtConfirmPassword" name="txtConfirmPassword">
	     </div>
	     <div class="form-group">
		<label for="txtFullname">Họ và tên</label>
		<input type="text" id="txtFullname" name="txtFullname">
	     </div>
	     <div class="form-group">
		<label for="txtEmail">Email</label>
		<input type="text" id="txtEmail" name="txtEmail">
	     </div>
	     <div class="form-group">
		<label for="txtPhone">Số điện thoại</label>
		<input type="text" id="txtPhone" name="txtPhone">
	     </div>
	     <div class="form-control">
		<input type="submit" value="Đăng ký" name="Register">
		<input type="reset" value="Reset" name="Reset">
	     </div>
	</form>
</body>
</html>
